<!DOCTYPE html>
<html lang="en">
<head>
    <title>Document</title>
</head>
<body>
  <h1>Switch statement</h1>
  <script>
    let x = 1;

    switch(x)
    {
      default: console.log("Wrong No.")
      case 101: console.log("Monday")
      case 21: console.log("Tuesday")
      case 13: console.log("Wednesday");  
      case 41: console.log("Thursday")
      case 50: console.log("Friday")
      case 16: console.log("Saturday")
      case 756: console.log("Sunday")
    }
  </script>    
</body>
</html>
