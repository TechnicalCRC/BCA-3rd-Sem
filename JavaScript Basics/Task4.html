<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Task 4</h1>
    <hr>
    <button style="background-color: palegreen; border: 0px; width: 150px; font-size: 20px; height: 30px; border-radius: 20px;" onclick="
    count = count + 1;  // count++;
    document.getElementById('result').innerHTML = 
    'Your bag has ' + count + ' items';
    ">Add to Bag</button>

    <button style="background-color:aliceblue; border: 3px solid black; width: 250px; font-size: 20px; height: 35px; border-radius: 10px;margin-top: 5px;" 
    onclick="
    document.getElementById('result').innerHTML = `Your bag has 
    ${--count} items`;
    "> MOVE TO WISHLIST</button>

    <button style="background-color: palegreen; border: 0px; width: 250px; font-size: 20px; height: 30px; border-radius: 20px;" onclick="
        count = count+2;
        document.getElementById('result').innerHTML = `Your bag has 
        ${count} items`;
        ">Add 1 + 1 sale Item</button>

    <h1 id="result">Your Bag has 0 items</h1>
    <script>
        let count = 0;
    </script>
</body>
