<!DOCTYPE html>
<html lang="en">
<head>
    <title>Document</title>
</head>
<body>
  <h1>If Alternatives</h1>   
  <script>
    // ternary operator - conditional operator
    let a = 10, b = 5;
    a>b ? console.log(" a is grater ") :console.log(" b is grater");
    

    // guard operator - to protect from all falsy values - ||
    let dob = '04-05-2000';
    let final_dob = dob || '01-01-2026';
    console.log(dob)
    console.log(final_dob)

    // 0 false '' NaN
// default operator - protect from 2 falsy values - undefined, null 
    let age = 5/'hello';
    let final_age = age ?? 1;
    console.log(age);
    console.log(final_age);

  </script> 
</body>
</html>
