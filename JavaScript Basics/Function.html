<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>Functions</h1>
    <script>
      // Normal Function
      // 1. without parameter without return
      function show() {
        console.log("This is show()");
      }
      show();

      // 2. with parameter without return
      function add(a, b) {
        console.log("add is " + (a + b));
      }
      add(4, 5);

      // 3. without parameter with return
      function sub() {
        let a = 5, b = 10;
        return(a - b);
      }
     console.log("Sub is " +sub());

    // 4. with parameter with return
      function mul(a, b) {
       return a*b;
      }
      console.log("Multiply is "+mul(4,7))

    </script>
  </body>
</html>
